services:
  # 1. Laravel Application (PHP 8.2-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopping-app:latest
    container_name: shopping_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: http://66.42.59.124:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-shopping_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - ./:/var/www
    networks:
      - shopping-network
    depends_on:
      - db

  # 2. Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: shopping_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - shopping-network
    depends_on:
      - app

  # 3. MySQL 8.0 Database
  db:
    image: mysql:8.0
    container_name: shopping_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shopping_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secretpassword}
    ports:
      - "33061:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - shopping-network

networks:
  shopping-network:
    driver: bridge

volumes:
  dbdata:
